# Accepted findings for the din5008-letter skill, with the reason for each.
#
# Written by hand, not by `skillspector baseline`, because a fingerprint baseline pins line numbers
# and says nothing about why. Every entry is a decision, and the reason is the point.
#
# SkillSpector does not apply a baseline a skill ships unless you pass --use-shipped-baseline, and
# that default is right: an author's baseline can hide findings from you. So this file does not
# change the number you see when you scan this folder. It shows what we decided, so you can
# disagree with it.
#
# Scanned with SkillSpector v2.11.1, static analysis only. Result: 16/100, LOW, CAUTION.
version: 2

rules:
  - id: "LP3"
    path: "SKILL.md"
    reason: >-
      No allowed-tools declaration, on purpose. A skill that declares its own tool scope
      pre-approves those tools inside your agent, which removes your permission decision instead of
      informing it, so this repository forbids the field. Rejected alternative: adding it to please
      the scanner, which trades your control for points of score. LP3 fires only because the
      skill ships scripts.
  - id: "AST4"
    path: "scripts/letter.py"
    reason: >-
      The skill renders with the Typst binary and, when present, reads the PDF back with pdftotext.
      Both are started from one function, run(), with an argument list and no shell, so there is a
      single place to audit. Rejected alternative: a Python PDF library, which would add a
      third-party dependency and still leave the independent check to a second program.

# NOT baselined, so the absence is not read as an oversight:
#
# Coverage reads "partial", which caps the recommendation at CAUTION. The cause is the picture
# link in SKILL.md, which points to ../../docs/assets/ on purpose: a binary inside this folder is a
# HIGH finding for a scanner that cannot read it. The picture renders in the repository and the
# folder stays text-only. A coverage finding is not suppressed, because that would hide the fact
# that part of the artifact was not analysed.
