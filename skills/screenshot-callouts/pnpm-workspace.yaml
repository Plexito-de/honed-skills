# esbuild's install script only verifies its platform binary; the bundle step in `setup` needs it.
allowBuilds:
  esbuild: true
# Security floors for transitive dependencies (Dependabot, 2026-11-12). Each override lifts only the
# vulnerable range to its first patched line; nothing outside that range moves.
overrides:
  "nanoid@<3.3.18": "3.3.20"
  "nanoid@>=4.0.0 <5.1.16": "5.1.16"
  "katex@<0.18.2": "0.18.11"
  "lodash-es@<4.18.0": "4.18.1"
