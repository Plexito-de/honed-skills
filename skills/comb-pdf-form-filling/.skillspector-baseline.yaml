# Accepted findings for this skill, with the reason for each.
#
# Generated by hand, not by `skillspector baseline`, because a fingerprint baseline pins line
# numbers and says nothing about why. Every entry here is a decision, and the reason is the point.
#
# READ THIS BEFORE TRUSTING IT. SkillSpector does not apply a baseline a skill ships unless you
# pass --use-shipped-baseline, and that default is correct: an author's baseline can hide findings
# from you. So this file does not improve the number you see when you scan this folder, and it is
# not meant to. It is here so you can see what we decided and disagree with it.
#
# Scanned with SkillSpector v2.11.1, static analysis only. Result: 22/100, MEDIUM, CAUTION.
version: 2

rules:
  - id: "AST4"
    path: "scripts/*.py"
    reason: >-
      subprocess with a list argv and no shell. Driving qpdf and poppler's pdftoppm IS the method
      of this skill, so the finding is correct and the behaviour is not removable. What makes it
      acceptable rather than merely unavoidable: every argv is a fixed literal list plus paths the
      caller supplied, never a string assembled from model output, and never shell=True. Read
      fill_example.py around the flagged lines and check that for yourself rather than taking this
      entry's word for it. Rejected alternative: a pure-Python PDF rasteriser, which would add a
      heavy dependency to avoid a call that is already the narrowest possible.

  - id: "LP3"
    path: "SKILL.md"
    reason: >-
      No allowed-tools declaration, deliberately. SkillSpector asks for one so a skill's intent can
      be validated, which is a fair goal; we decline because a skill that declares its own tool
      scope pre-approves those tools inside your agent, and that removes your permission decision
      rather than informing it. This repository forbids the field for that reason. Rejected
      alternative: adding it to satisfy the scanner, which would trade a real reduction in your
      control for seven points of score. Note also that LP3 only fires because this skill ships
      scripts at all: the same SKILL.md with no scripts/ directory produces no LP3.

# NOT baselined, and worth stating so the absence is not read as an oversight:
#
# The scan reports coverage "partial", which caps the recommendation at CAUTION however clean the
# findings are, because an incomplete analysis can never be reported SAFE. The cause is
# reference extraction treating ordinary prose as unresolvable local paths. Measured on this file:
# `12/345/67890` (a German Steuernummer, which is the example the skill exists to get right),
# `/combfill/bin/pip` (a real command a reader types), `anthropics/skills` and
# `claude-office-skills/pdf-form-filler` (repository references in the prior-art section).
#
# A hypothesis worth recording as FALSE, since it is the obvious guess: the PDF dictionary keys
# this skill is full of (/Rect, /AP, /MaxLen, /Ff) are NOT the cause. Replacing all 29 of them and
# re-scanning did not reduce the unresolved count.
#
# So SAFE is reachable here only by deleting the tax-number example, the install command and the
# prior-art credits. That would make the skill worse to read in exchange for one word in a report,
# so we keep the prose and accept CAUTION. Suppressing a coverage finding would be the wrong move
# in any case: it would hide the fact that part of the artifact was not analysed.
