      function insidePolygon(pts, x, y) {
        let hit = false;
        for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
          const a = pts[i],
            b = pts[j];
          if (a.y > y !== b.y > y && x < ((b.x - a.x) * (y - a.y)) / (b.y - a.y) + a.x)
            hit = !hit;
        }
        return hit;
      }
      const distToRect = (q, x, y) =>
        Math.hypot(
          Math.max(q.l - x, 0, x - q.r),
          Math.max(q.t - y, 0, y - q.b),
        );

      // Which of the draft's words a mark points at, by the mark's own shape: a box takes the words
      // whose centre is inside it, a circle the words inside the ellipse, a lasso the words inside
      // the loop, an open stroke (underline, strike, scribble) the word nearest each point it
      // passes, and an arrow the word at its head.
      function markedWords(m, words, W, H) {
        const k = markBounds(m),
          [l, r, t, b] = [k.x0 * W, k.x1 * W, k.y0 * H, k.y1 * H];
        if (m.tool === "rect")
          return words.filter((q) => q.cx >= l && q.cx <= r && q.cy >= t && q.cy <= b);
        if (m.tool === "ellipse") {
          const [ex, ey] = [(l + r) / 2, (t + b) / 2],
            [rx, ry] = [Math.max(1, (r - l) / 2), Math.max(1, (b - t) / 2)];
          return words.filter(
            (q) => ((q.cx - ex) / rx) ** 2 + ((q.cy - ey) / ry) ** 2 <= 1,
          );
        }
        const nearest = (x, y, reach) => {
          let best = null,
            dist = reach;
          words.forEach((q) => {
            const d = distToRect(q, x, y);
            if (d <= dist) [dist, best] = [d, q];
          });
          return best;
        };
        if (m.tool === "arrow") {
          const q = nearest(m.x1 * W, m.y1 * H, ARROW_REACH);
          return q ? [q] : [];
        }
        const pts = m.path.map((p) => ({ x: p.x * W, y: p.y * H })),
          [a, z] = [pts[0], pts.at(-1)],
          closed =
            pts.length > 8 &&
            Math.hypot(a.x - z.x, a.y - z.y) < 0.25 * Math.hypot(r - l, b - t);
        if (closed) return words.filter((q) => insidePolygon(pts, q.cx, q.cy));
        // The stroke as drawn, not only where the pointer reported: a fast underline sends few
        // points, and the segment between two of them can cross a word neither point is near.
        const dense = pts.flatMap((p, i) => {
          const o = pts[i - 1];
          if (!o) return [p];
          const n = Math.ceil(Math.hypot(p.x - o.x, p.y - o.y) / (STROKE_REACH / 2));
          return [...Array(n)].map((_, j) => ({
            x: o.x + ((p.x - o.x) * (j + 1)) / n,
            y: o.y + ((p.y - o.y) * (j + 1)) / n,
          }));
        });
        return [...new Set(dense.map((p) => nearest(p.x, p.y, STROKE_REACH)))].filter(
          Boolean,
        );
      }

      // The words a mark on a draft sits on. Per block, the quote runs from the first marked word
      // to the last as the draft shows it, punctuation and inline markup included, so it can be
      // found in the source. A mark over no words still names the block it sits on, and `box`
      // says where it is.
      function textUnder(surface, mark) {
        const m = placed(surface, mark),
          b = surface.box.getBoundingClientRect(),
          words = [];
        // Words are found in each block's whole text, then mapped back to its text nodes, so
        // `<strong>bold</strong>er` is one word "bolder", not "bold" and "er".
        // A list item, a table cell, a line break or a nested block still ends a word: a rendered
        // list has no whitespace between its items, and "alpha" "beta" must not become one word.
        // Two text nodes in different structural containers are split, which covers both entering
        // a nested list and the text that follows it.
        for (const blk of surface.doc.querySelectorAll("[data-blk]")) {
          const nodes = [],
            walk = document.createTreeWalker(
              blk,
              NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT,
            );
          let text = "",
            run;
          for (let n = walk.nextNode(); n; n = walk.nextNode()) {
            if (n.nodeType === 1) {
              // entering one breaks too, so an empty nested block still splits its neighbours
              if (n.tagName === "BR" || n.matches(WORD_RUNS)) text += "\n";
              continue;
            }
            const box = n.parentElement.closest(WORD_RUNS);
            if (run !== undefined && box !== run) text += "\n";
            run = box;
            nodes.push([n, text.length]);
            text += n.data;
          }
          // A start on a node boundary belongs to the later node, an end to the earlier one.
          const point = (i, end) => {
            let k = nodes.length - 1;
            while (k > 0 && (end ? nodes[k][1] >= i : nodes[k][1] > i)) k--;
            return [nodes[k][0], i - nodes[k][1]];
          };
          for (const [at, len] of wordsOf(text)) {
            const range = document.createRange();
            range.setStart(...point(at, false));
            range.setEnd(...point(at + len, true));
            const q = range.getBoundingClientRect();
            if (!q.width || !q.height) continue; // laid out but not shown
            const [l, t] = [q.left - b.left, q.top - b.top];
            words.push({
              range,
              blk,
              l,
              t,
              r: l + q.width,
              b: t + q.height,
              cx: l + q.width / 2,
              cy: t + q.height / 2,
            });
          }
        }
        const hit = new Set(markedWords(m, words, b.width, b.height)),
          byBlock = new Map();
        words
          .filter((q) => hit.has(q))
          .forEach((q) => {
            const span = byBlock.get(q.blk);
            if (span) span.setEnd(q.range.endContainer, q.range.endOffset);
            else byBlock.set(q.blk, q.range.cloneRange());
          });
        const k = markBounds(m),
          blocks = [...byBlock.keys()].map((el) => el.getAttribute("data-blk"));
        const parts = [...byBlock].map(([el, span]) => ({
          block: el.getAttribute("data-blk"),
          quote: span.toString(),
        }));
        return {
          blocks: blocks.length ? blocks : m.pin ? [m.pin.blk] : [],
          ...(parts.length > 1 && { parts }),
          quote: parts.map((p) => p.quote).join("\n"),
          box: {
            x: +k.x0.toFixed(4),
            y: +k.y0.toFixed(4),
            w: +(k.x1 - k.x0).toFixed(4),
            h: +(k.y1 - k.y0).toFixed(4),
          },
        };
      }

      async function exportSurface(surface) {
        const mine = marks.filter((m) => m.item === surface.key);
        if (!mine.length) return null;
        let over, w, h;
        if (surface.pdfPage) {
          const scale = Math.min(MAX_SCALE, EXPORT_W / surface.pt.w);
          const vp = surface.pdfPage.getViewport({ scale });
          w = Math.round(vp.width);
          h = Math.round(vp.height);
          over = document.createElement("canvas");
          over.width = w;
          over.height = h;
          const ctx = over.getContext("2d");
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, w, h); // a PDF page has no background of its own
          await surface.pdfPage.render({ canvasContext: ctx, viewport: vp })
            .promise;
          mine.forEach((m) => strokeMark(ctx, m, w, h, numberOf(m)));
        } else {
          const img = surface.img;
          w = img.naturalWidth;
          h = img.naturalHeight;
          over = document.createElement("canvas");
          over.width = w;
          over.height = h;
          const ctx = over.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          mine.forEach((m) => strokeMark(ctx, m, w, h, numberOf(m)));
        }
        const crops = [];
        for (const m of mine) {
          let { x0: fx0, x1: fx1, y0: fy0, y1: fy1 } = markBounds(m);
          const px = Math.max((fx1 - fx0) * 0.35, 0.05),
            py = Math.max((fy1 - fy0) * 0.35, 0.035);
          fx0 = Math.max(0, fx0 - px);
          fy0 = Math.max(0, fy0 - py);
          fx1 = Math.min(1, fx1 + px);
          fy1 = Math.min(1, fy1 + py);
          crops.push({
            mark: m.id,
            png: await cropPng(surface, over, m, fx0, fy0, fx1, fy1, w, h),
          });
        }
        return { overview: over.toDataURL("image/png"), crops, marks: mine };
      }

      async function cropPng(surface, over, m, fx0, fy0, fx1, fy1, w, h) {
        const c = document.createElement("canvas");
        if (surface.pdfPage) {
          const cw = (fx1 - fx0) * surface.pt.w,
            ch = (fy1 - fy0) * surface.pt.h;
          const scale = Math.max(
            1,
            Math.min(MAX_SCALE, CROP_LONG / Math.max(cw, ch)),
          );
          c.width = Math.max(24, Math.round(cw * scale));
          c.height = Math.max(24, Math.round(ch * scale));
          const ctx = c.getContext("2d");
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, c.width, c.height);
          const vp = surface.pdfPage.getViewport({ scale });
          await surface.pdfPage.render({
            canvasContext: ctx,
            viewport: vp,
            transform: [
              1,
              0,
              0,
              1,
              -fx0 * surface.pt.w * scale,
              -fy0 * surface.pt.h * scale,
            ],
          }).promise;
          ctx.save();
          ctx.translate(
            -fx0 * surface.pt.w * scale,
            -fy0 * surface.pt.h * scale,
          );
          strokeMark(
            ctx,
            m,
            surface.pt.w * scale,
            surface.pt.h * scale,
            numberOf(m),
          );
          ctx.restore();
          return c.toDataURL("image/png");
        }
        const x0 = Math.round(fx0 * w),
          y0 = Math.round(fy0 * h);
        c.width = Math.max(24, Math.round((fx1 - fx0) * w));
        c.height = Math.max(24, Math.round((fy1 - fy0) * h));
        c.getContext("2d").drawImage(
          over,
          x0,
          y0,
          c.width,
          c.height,
          0,
          0,
          c.width,
          c.height,
        );
        return c.toDataURL("image/png");
      }

      /* ---------------- never lose what was typed ---------------- */
      // Everything lives in this page until Send, so a closed tab, a reload or a crash used to cost the
      // whole round. The state is posted to the server on every change, debounced, and read back on load.
      // No save may start once Send is pressed. A save still pending at that moment used to land after the
      // server had deleted the draft, so the next round on the same files opened with this round's notes
      // and text, and every restored block reported itself as an edit. Measured 2026-09-30: draft.json
      // written in the same second as the Send it should not have outlived.
      let saveTimer = null,
        sending = false;
      function saveDraft() {
        clearTimeout(saveTimer);
        if (sending) return;
        saveTimer = setTimeout(() => {
          const blocks = {};
          document.querySelectorAll("[data-blk]").forEach((el) => {
            blocks[el.getAttribute("data-blk")] = el.innerHTML;
          });
          const body = JSON.stringify({
            marks,
            comments,
            seq,
            overall: document.getElementById("overall").value,
            blocks,
          });
          try {
            localStorage.setItem(`review:${window.__SESSION__}`, body);
          } catch (e) {}
          fetch("/draft", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body,
          }).catch(() => {});
        }, 400);
      }
      document.getElementById("overall").addEventListener("input", saveDraft);

      async function restoreDraft() {
        let d = null,
          answered = false;
        try {
          const r = await fetch("/draft");
          if (r.ok) {
            d = await r.json();
            answered = true;
          }
        } catch (e) {}
        // A server that answers is the authority, and an empty answer means the round was sent or never
        // started. The copy in this browser is only for a server that did not answer: after a Send, a
        // second tab can still write one, and on a fixed port it would come back in the next round.
        if (!answered) {
          try {
            d = JSON.parse(
              localStorage.getItem(`review:${window.__SESSION__}`) || "null",
            );
          } catch (e) {
            d = null;
          }
        }
        if (
          !d ||
          (!d.marks?.length && !d.comments?.length && !d.overall && !d.blocks)
        )
          return;
        marks = d.marks || [];
        comments = d.comments || [];
        seq =
          d.seq ||
          Math.max(0, ...marks.map((m) => m.id), ...comments.map((c) => c.id));
        if (d.overall) document.getElementById("overall").value = d.overall;
        Object.entries(d.blocks || {}).forEach(([key, htmlText]) => {
          const el = document.querySelector(`[data-blk="${CSS.escape(key)}"]`);
          if (el && el.innerHTML !== htmlText) el.innerHTML = htmlText;
        });
        renderFeed();
        redraw();
      }

      // The snapshot of the original text has to be taken before a draft overwrites the blocks, or every
      // restored edit reports itself as unchanged.
      requestAnimationFrame(() =>
        requestAnimationFrame(async () => {
          await restoreDraft();
          buildNav();
          trackPosition();
          // A hook, not a switch: nothing defines window.__TEST__ unless `selftest --browser`
          // injects it, and the getters hand out the live state rather than a stale copy.
          if (window.__TEST__)
            window.__TEST__({
              get stops() {
                return stops;
              },
              get marks() {
                return marks;
              },
              get comments() {
                return comments;
              },
              jumpTo,
              SURFACES,
              anchorFor,
              textUnder,
              pinToBlock,
              buildBatch,
              exportSurface,
              setTool,
              buildTextLayer,
              textLayers,
            });
        }),
      );

      // Everything Send posts, built apart from the posting so the browser selftest can read it.
      async function buildBatch() {
        const eds = edits();
        const pages = [];
        for (const surface of SURFACES.values()) {
          if (surface.doc) continue; // a draft's marks travel with its text page, below
          const ex = await exportSurface(surface);
          if (!ex) continue;
          pages.push({
            kind: "media",
            item: surface.item,
            page: surface.page,
            pages: surface.pages,
            name: surface.label,
            overview_png: ex.overview,
            crops: ex.crops,
            comments: ex.marks.map((m) => ({
              id: `m_${m.id}`,
              number: numberOf(m),
              tool: m.tool,
              note: m.note,
              quote: m.quote,
              anchor: m.anchor,
              rects: m.rects,
              box: {
                x: +Math.min(m.x0, m.x1).toFixed(4),
                y: +Math.min(m.y0, m.y1).toFixed(4),
                w: +Math.abs(m.x1 - m.x0).toFixed(4),
                h: +Math.abs(m.y1 - m.y0).toFixed(4),
              },
            })),
          });
        }
        ITEMS.filter((i) => i.kind === "text").forEach((item) => {
          // The words were read when the mark was drawn. A mark restored from a draft saved before
          // that existed has none yet, and is read now.
          const surface = SURFACES.get(`${item.id}#marks`);
          const drawn = marks
            .filter((m) => surface && m.item === surface.key)
            .map((m) => {
              const at = m.quote === undefined ? textUnder(surface, m) : m;
              return {
                id: `m_${m.id}`,
                number: numberOf(m),
                tool: m.tool,
                quote: at.quote,
                blocks: at.blocks,
                ...(at.parts && { parts: at.parts }),
                box: at.box,
                note: m.note,
              };
            });
          const mine = comments.filter((c) => c.item === item.id);
          const myEdits = eds.filter((e) => e.item === item.id);
          if (!mine.length && !myEdits.length && !drawn.length) return;
          pages.push({
            kind: "text",
            item: item.id,
            name: item.name,
            comments: [
              ...mine.map((c) => ({
                id: `c_${c.id}`,
                number: numberOf(c),
                quote: c.quote,
                anchor: c.anchor,
                block: c.block,
                ...(c.blocks && { blocks: c.blocks, parts: c.parts }),
                note: c.note,
              })),
              ...drawn,
            ].sort((a, b) => a.number - b.number),
            edits: myEdits.map((e) => ({
              block: e.key,
              label: e.label,
              before: e.before,
              after: e.after,
            })),
          });
        });

        // A note whose page is gone (the file changed between two rounds) is still the reviewer's text.
        // It goes with the overall note rather than nowhere.
        const orphans = ordered().filter((m) => !whereOf(m) && m.note.trim());
        let note = document.getElementById("overall").value;
        if (orphans.length) {
          note = [
            note.trim(),
            ...orphans.map(
              (m) =>
                `About a page that is no longer in the file: ${m.note.trim()}`,
            ),
          ]
            .filter(Boolean)
            .join("\n");
        }
        return { pages, note };
      }

      document.getElementById("send").onclick = async () => {
        sending = true;
        clearTimeout(saveTimer); // the batch below carries this state, see saveDraft
        document.activeElement?.blur(); // a keystroke from here on would reach neither
        document.getElementById("send").disabled = true;
        document.getElementById("status").textContent = "sending…";
        const { pages, note } = await buildBatch();
        const n = pages.reduce(
          (s, p) => s + (p.comments || []).length + (p.edits || []).length,
          0,
        );
        let r;
        try {
          r = await fetch("/send", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ pages, overall_note: note }),
          });
        } catch (e) {
          r = { ok: false, statusText: e.message };
        }
        const foot = document.querySelector("footer");
        if (r.ok) {
          // The page has to LOOK finished. The first version disabled the button, said "received" in 13px
          // grey beside it, and left everything else live, so it read as a dead button on a live page and
          // the sender clicked it again and again. Measured on the first real use, 2026-09-10.
          document.body.classList.add("sent");
          closeDrawers();
          const items = n + (note.trim() ? 1 : 0);
          try {
            localStorage.removeItem(`review:${window.__SESSION__}`);
          } catch (e) {}
          foot.innerHTML = `<span class="done"><span class="tick">&#10003;</span><span>Sent.
      ${items} item${items === 1 ? "" : "s"} went to the agent.
      <small>Closing this window.</small></span></span>`;
          // A browser lets a page close its own tab only while that tab has one history entry, and it does
          // not care what sent the batch: a review opened in a tab that already showed a page is refused,
          // by a click and by Cmd+Enter alike. Measured 2026-09-30 in Edge. window.closed turns true at once
          // when the browser accepts and stays false when it refuses. The server is told either way, closes
          // a refused tab from outside where it can, and stops. A page that is still here after that says
          // plainly that it is finished, rather than pretend it closed.
          setTimeout(async () => {
            window.close();
            await fetch("/close", {
              method: "POST",
              keepalive: true,
              body: JSON.stringify({ refused: !window.closed }),
            }).catch(() => {});
            setTimeout(() => {
              const s = foot.querySelector(".done small");
              if (s)
                s.textContent =
                  "Nothing more to do here. You can close this window.";
            }, 400);
          }, 900);
        } else if (r.status === 409) {
          // Another tab of this review sent first. Nothing from this tab went, and a retry cannot help.
          document.getElementById("status").textContent =
            "already sent from another tab, nothing from this tab was sent";
        } else {
          sending = false;
          saveDraft(); // the save cancelled at Send still has to happen
          document.getElementById("send").disabled = false;
          document.getElementById("status").textContent =
            `send failed (${r.statusText || "no reply"}), your marks are still here, try again`;
        }
      };
    </script>
  </body>
</html>
