# Scanned with SkillSpector v2.11.1, static analysis only. Bare result: 22/100, MEDIUM,
# from three occurrences of one rule and one policy rule. Nothing else is suppressed, and the
# number a stranger sees is the bare one: a shipped baseline is ignored unless the reader opts
# into it, so this file lowers nothing for anybody but us.
version: 2
rules:
  - id: "LP3"
    reason: >-
      No allowed-tools by policy. A skill that declares its own tool scope pre-approves those
      tools inside a stranger's agent and removes the human's permission decision, which this
      repository forbids. Rejected the alternative of adding the field to satisfy the scanner:
      that trades a real safety property for a few points.
  - id: "AST4"
    path: "scripts/*.py"
    reason: >-
      Driving an external media tool is the whole method of this skill: there is no way to
      decode a video without it. The child process is started from a list argument vector with
      no shell, and the executable is resolved from PATH rather than taken from input. Every
      other element is a literal, a path the caller passed, or a filter string this file builds
      from its own numeric arguments after argparse has coerced them to float or int. No string
      from a model, a video, or a file on disk ever reaches the argument vector. Rejected the alternative of a Python decoding library, which
      would add a large binary dependency to do worse what one tool already does everywhere.
